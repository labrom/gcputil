name: gcputil
description: Utilities for Dart services running on Google Cloud, including metadata, Secret Manager, Cloud KMS, and Cloud Tasks helpers.
version: 0.2.0
repository: https://github.com/labrom/gcputil
issue_tracker: https://github.com/labrom/gcputil/issues
topics:
  - google-cloud
  - secret-manager
  - cloud-kms
  - cloud-tasks

environment:
  sdk: ^3.9.0

dependencies:
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.2
  http: ^1.6.0

dev_dependencies:
  lints: ^6.0.0
